<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <!-- Primary -->
    <title>VMEX — Fast, Secure V2Ray Servers in Sri Lanka</title>
    <meta
      name="description"
      content="Ultra-low latency V2Ray configs (VLESS, VMess, Trojan) on Singapore & India servers. Works with Dialog, SLT Mobitel, Hutch, Airtel and fiber. Instant delivery, 24/7 support."
    />
    <meta
      name="keywords"
      content="V2Ray Sri Lanka, VLESS, VMess, Trojan, Dialog Zoom, SLT Mobitel, Hutch, Airtel, gaming VPN Sri Lanka, VMEX"
    />
    <meta name="author" content="VMEX Solutions" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://vmex.net/" />

    <!-- Theme -->
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#050b1a" />
    <meta name="darkreader-lock" />

    <!-- Open Graph (text-only preview) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="VMEX" />
    <meta property="og:url" content="https://vmex.net/" />
    <meta property="og:title" content="VMEX — Fast, Secure V2Ray Servers" />
    <meta
      property="og:description"
      content="Low-latency V2Ray configs on Singapore & India servers for Sri Lankan networks. Instant delivery, 24/7 support."
    />
    <meta property="og:locale" content="en_LK" />

    <!-- Twitter / X (text-only card) -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="VMEX — Fast, Secure V2Ray Servers" />
    <meta
      name="twitter:description"
      content="Low-latency V2Ray configs on Singapore & India servers for Sri Lankan networks."
    />

    <!-- Fonts (faster loading) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Structured data for Google -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://vmex.net/#org",
            "name": "VMEX Solutions",
            "url": "https://vmex.net/",
            "areaServed": "LK"
          },
          {
            "@type": "WebSite",
            "@id": "https://vmex.net/#website",
            "url": "https://vmex.net/",
            "name": "VMEX",
            "publisher": { "@id": "https://vmex.net/#org" },
            "inLanguage": "en"
          }
        ]
      }
    </script>
  </head>
  <body>
    <noscript>VMEX needs JavaScript enabled to run.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
